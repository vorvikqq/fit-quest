meta:
  title: "IT-квест до Дня ФІТ 👾"
  defaults:
    time_limit: 20
    shuffle_options: true
    shuffle_questions: false
  promo:
    code: "HILLEL1000"
    text: |
      🎁 Подарунок для кожного учасника від Hillel IT School —
      промокод <code>HILLEL1000</code> на знижку 1000 грн на будь-який курс!

