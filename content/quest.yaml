rounds:

  # ===================================================================
  - id: r1
    title: "Раунд 1 · IT Quizlet 💻"
    intro: "10 питань на базові знання з IT. Обирай одну відповідь з чотирьох."
    time_limit: 20
    shuffle_options: true
    sections:
      - id: r1s1
        question_type: choice
        questions:
          - id: r1q01
            text: "Яка система числення є фундаментальною для роботи сучасних цифрових комп’ютерів?"
            options: ["Десяткова", "Двійкова", "Вісімкова", "Шістнадцяткова"]
            correct: 1
            explanation: "Двійкова: усі дані в комп’ютері зрештою — це нулі й одиниці."

          - id: r1q02
            text: "Скільки бітів міститься в одному байті?"
            options: ["4", "8", "16", "32"]
            correct: 1
            explanation: "1 байт = 8 бітів."

          - id: r1q03
            text: "Який оператор у C++ використовується для виведення даних у консоль разом з об’єктом std::cout?"
            options: [">>", "<<", "::", "->"]
            correct: 1
            explanation: "<< — оператор виведення в потік."

          - id: r1q04
            text: "Який результат поверне вираз 7 / 2 у C++, якщо обидва операнди — цілі числа (int)?"
            options: ["3.5", "4", "3", "Помилку компіляції"]
            correct: 2
            explanation: "3: при діленні двох int дробова частина відкидається."

          - id: r1q05
            text: "Яку функцію виконує термопаста між процесором (CPU) і системою охолодження?"
            options:
              - "Склеює процесор із кулером, щоб він не випав"
              - "Заповнює мікронерівності для кращої передачі тепла від кришки процесора до радіатора"
              - "Ізолює процесор від статичної електрики"
              - "Знижує споживання електроенергії процесором"
            correct: 1
            explanation: "Термопаста заповнює мікронерівності між поверхнями й покращує теплопровідність."

          - id: r1q06
            text: "Яку бібліотеку треба підключити в C++, щоб використовувати потоки cin та cout?"
            options: ["#include <cmath>", "#include <vector>", "#include <iostream>", "#include <string>"]
            correct: 2
            explanation: "<iostream> — стандартні потоки введення/виведення."

          - id: r1q07
            text: "Чим SSD принципово відрізняється від класичного жорсткого диска (HDD)?"
            options:
              - "У SSD немає рухомих механічних деталей — дані зберігаються на мікросхемах пам’яті"
              - "SSD працює лише без підключення до материнської плати"
              - "На SSD неможливо встановити операційну систему"
              - "HDD завжди працює швидше за будь-який SSD"
            correct: 0
            explanation: "У SSD немає магнітних пластин і головок, тому він набагато швидший і тихіший."

          - id: r1q08
            text: "Яка конструкція в C++ є циклом із післяумовою (тіло гарантовано виконається хоча б раз)?"
            options: ["for", "while", "do ... while", "repeat ... until"]
            correct: 2
            explanation: "do … while спершу виконує тіло, а потім перевіряє умову."

          - id: r1q09
            text: "Яка програма запускається першою під час увімкнення комп’ютера, перевіряє комплектуючі (POST) і передає керування завантажувачу ОС?"
            options: ["Диспетчер завдань", "BIOS або UEFI", "Командний рядок (CMD)", "Драйвер чипсета"]
            correct: 1
            explanation: "BIOS/UEFI — прошивка материнської плати, вона стартує першою."

          - id: r1q10
            text: "Який HTTP-код повертає вебсервер, коли запитувану сторінку не знайдено?"
            options: ["200", "403", "404", "500"]
            correct: 2
            explanation: "404 Not Found."

  # ===================================================================
  - id: r2
    title: "Раунд 2 · Правда чи брехня: факти про ФІТ 🏛"
    intro: "Перед тобою факти про наш факультет. Деякі справжні, а деякі ми вигадали. Розпізнаєш, де що?"
    time_limit: 15
    shuffle_questions: true
    sections:
      - id: r2s1
        question_type: binary
        labels: ["✅ Правда", "❌ Брехня"]   # correct: 0 = правда, 1 = брехня
        questions:
          - id: r2q01
            text: "Факультет інформаційних технологій — наймолодший факультет КНУ імені Тараса Шевченка."
            correct: 0
            explanation: "Правда. Наказ про створення вийшов 20 листопада 2013 року. Деякі інститути створено пізніше, але серед факультетів наш — наймолодший."

          - id: r2q02
            text: "Першою будівлею, де розміщувався ФІТ, був корпус Військового інституту КНУ імені Тараса Шевченка."
            correct: 0
            explanation: "Правда. Факультет базувався на території ВІКНУ близько двох років."

          - id: r2q03
            text: "Кабінет декана факультету Віталія Снитюка розташований на третьому поверсі й має номер 301."
            correct: 0
            explanation: "Правда. Кабінет декана — саме 301."

          - id: r2q04
            text: "Корпус ФІТ розташований у пішій доступності від корпусів КПІ ім. Ігоря Сікорського."
            correct: 0
            explanation: "Правда. Вулиця Богдана Гаврилишина межує з територією КПІ."

          - id: r2q05
            text: "ФІТ заснували напередодні 180-річчя КНУ імені Тараса Шевченка."
            correct: 0
            explanation: "Правда. Університет засновано 1834 року, тож 2014-го йому виповнилося 180."

          - id: r2q06
            text: "Щоосені на факультеті проводять міжнародну наукову конференцію з абревіатурою «IT&I»."
            correct: 0
            explanation: "Правда. Це щорічна міжнародна конференція «Інформаційні технології та впровадження» (Information Technology and Implementation, IT&I)."

          - id: r2q07
            text: "На факультеті працює Заслужений діяч науки і техніки України."
            correct: 0
            explanation: "Правда. Це Кравченко Юрій Васильович."

          - id: r2q08
            text: "Першого навчального року на ФІТ набрали 335 студентів."
            correct: 1
            explanation: "Брехня. У 2014–2015 н. р. набрали 178 студентів."

          - id: r2q09
            text: "У корпусі ФІТ на вулиці Богдана Гаврилишина є 6-й поверх, куди мають доступ лише викладачі й фахівці кафедр."
            correct: 1
            explanation: "Брехня. Будівля має лише 5 поверхів."

          - id: r2q10
            text: "Вулиця, на якій стоїть корпус ФІТ, раніше називалася вулицею Будівельників."
            correct: 1
            explanation: "Брехня. Раніше це була вулиця Ванди Василевської."

  # ===================================================================
  - id: r3
    title: "Раунд 3 · Чоловік чи жінка? 👨‍💻👩‍💻"
    intro: "Відомі винаходи й досягнення в IT. Вгадай, хто за ними стоїть: чоловік чи жінка?"
    time_limit: 15
    shuffle_questions: true
    sections:
      - id: r3s1
        question_type: binary
        labels: ["👨 Чоловік", "👩 Жінка"]   # correct: 0 = чоловік, 1 = жінка
        questions:
          - id: r3q01
            text: "Хто написав першу в історії програму для обчислювальної машини (Аналітичної машини Беббіджа)?"
            correct: 1
            explanation: "Жінка — Ада Лавлейс."

          - id: r3q02
            text: "Хто винайшов World Wide Web?"
            correct: 0
            explanation: "Чоловік — Тім Бернерс-Лі."

          - id: r3q03
            text: "Хто створив мову програмування C?"
            correct: 0
            explanation: "Чоловік — Денніс Рітчі."

          - id: r3q04
            text: "Хто створив перший компілятор (1952)?"
            correct: 1
            explanation: "Жінка — Грейс Гоппер."

          - id: r3q05
            text: "Хто створив першу в СРСР мову програмування з вказівниками (Адресну мову)?"
            correct: 1
            explanation: "Жінка — Катерина Ющенко, українська науковиця."

          - id: r3q06
            text: "Хто створив мову програмування Python?"
            correct: 0
            explanation: "Чоловік — Гвідо ван Россум."

          - id: r3q07
            text: "Хто створив мову програмування Java?"
            correct: 0
            explanation: "Чоловік — Джеймс Гослінг."

          - id: r3q08
            text: "Хто надіслав перший в історії електронний лист і обрав символ «@» для адреси?"
            correct: 0
            explanation: "Чоловік — Рей Томлінсон."

          - id: r3q09
            text: "Хто сформулював принцип підстановки (літера «L» у SOLID) і створив мову CLU?"
            correct: 1
            explanation: "Жінка — Барбара Лісков."

          - id: r3q10
            text: "Хто винайшов протокол STP (Spanning Tree Protocol), що не дає комп’ютерній мережі «зациклюватися»?"
            correct: 1
            explanation: "Жінка — Радія Перлман."

  # ===================================================================
  - id: r4
    title: "Раунд 4 · Чи існує такий застосунок? 📱"
    intro: "Дивні, смішні й абсурдні застосунки. Одні справді існують, інші ми вигадали. Вгадай, які справжні!"
    time_limit: 25
    shuffle_questions: true
    sections:
      - id: r4s1
        question_type: binary
        labels: ["📱 Існує", "🙅 Вигадка"]   # correct: 0 = існує, 1 = вигадка
        questions:
          - id: r4q01
            text: "<b>Pay My Billy</b>\nПлатформа, де люди публікують свої рахунки (оренда, комуналка, лікування, навчання), а благодійники гортають їх, як у застосунку для знайомств, і обирають, кому допомогти."
            correct: 0
            explanation: "Існує! Ідея «Tinder для мільярдерів, які платять за твої рахунки» стала вірусною в X у жовтні 2026, і розробники одразу зробили pay my billy. Поки що це демо без справжніх грошей."

          - id: r4q02
            text: "<b>Queue Buddy</b>\nПоказує, скільки приблизно чекати в черзі в популярних закладах. Користувачі самі повідомляють про довжину черг у реальному часі."
            correct: 0
            explanation: "Існує! QueueBuddy збирає від користувачів дані про черги в кафе, ресторанах і на заходах у реальному часі."

          - id: r4q03
            text: "<b>Live Webcam</b>\nДозволяє дивитися трансляції з вебкамер у різних містах і країнах: вулиці, площі, пляжі, туристичні місця в реальному часі."
            correct: 0
            explanation: "Існує! Застосунків з вебкамерами з усього світу багато: можна годинами дивитися на чужі пляжі й площі."

          - id: r4q04
            text: "<b>Almost Crossed</b>\nАналізує історію місцезнаходжень двох людей і показує, чи перетиналися їхні шляхи ще до знайомства."
            correct: 0
            explanation: "Існує! Almost Crossed шукає місця, де ви могли бути поруч задовго до того, як познайомилися."

          - id: r4q05
            text: "<b>RunPee</b>\nПідказує, коли найкраще вийти в туалет під час фільму, щоб не пропустити важливі сцени, і коротко переказує, що ти пропустив."
            correct: 0
            explanation: "Існує! RunPee — реальний застосунок для кіноманів."

          - id: r4q06
            text: "<b>S.M.T.H. (Send Me To Heaven)</b>\nПропонує підкинути смартфон якомога вище, вимірює висоту польоту й порівнює результати у світовому рейтингу."
            correct: 0
            explanation: "Існує! І так, люди справді розбивали телефони заради рекорду."

          - id: r4q07
            text: "<b>whoBIRD</b>\nЧерез мікрофон смартфона розпізнає птахів за співом, навіть якщо ти їх не бачиш."
            correct: 0
            explanation: "Існує! whoBIRD — застосунок для Android, що розпізнає птахів за голосом."

          - id: r4q08
            text: "<b>FridgeSmart</b>\nЗа одним фото холодильника розпізнає продукти, підказує, які скоро зіпсуються, і пропонує рецепти, щоб ти встиг їх використати."
            correct: 0
            explanation: "Існує! FridgeSmart з ШІ-сканером холодильника вийшов у 2026 році."

          - id: r4q09
            text: "<b>Friendship Expiry</b>\nАналізує частоту спілкування, кількість повідомлень і спільних фото та прогнозує, скільки ще триватиме дружба."
            correct: 1
            explanation: "Вигадка! Термін придатності дружби поки що ніхто не рахує 😅"

          - id: r4q10
            text: "<b>WiFi Mood</b>\nВизначає настрій користувача за швидкістю Wi-Fi і кількістю розривів з'єднання."
            correct: 1
            explanation: "Вигадка! Хоча після третього розриву з'єднання за пару настрій справді падає."

  # ===================================================================
