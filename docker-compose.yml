services:
  db:
    image: postgres:16
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"   # ротація: журнал не заповнить диск сервера
        max-file: "5"
    restart: unless-stopped
    environment:
      POSTGRES_USER: quest
      POSTGRES_PASSWORD: quest
      POSTGRES_DB: quest
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d quest"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Порт назовні не відкриваємо: БД доступна лише боту в мережі compose.

  bot:
    build: .
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      # Усередині compose БД завжди за іменем сервісу, незалежно від .env
      DATABASE_URL: postgresql+asyncpg://quest:quest@db:5432/quest
    ports:
      # Живе табло. За замовчуванням лише localhost (за nginx/Caddy);
      # для прямого доступу задай BOARD_BIND=0.0.0.0 у .env і користуйся довгим BOARD_TOKEN.
      - "${BOARD_BIND:-127.0.0.1}:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Контент можна правити без перезбирання образу (NFR-5); /reload_content або рестарт.
      - ./content:/app/content:ro

volumes:
  pgdata:
